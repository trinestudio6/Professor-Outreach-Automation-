name: Deploy Frontend to Hostinger

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Create build environment
        run: |
          echo "VITE_API_BASE_URL=https://n8n.trinism.tech/webhook" > .env
          echo "VITE_SUPABASE_URL=https://ynehejtasvjwjpawriqg.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InluZWhlanRhc3Zqd2pwYXdyaXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMjU3MzcsImV4cCI6MjEwNDkwMTczN30.eq2br1-EPPysngYdc9BZCA19KZyU26q9VbsHB_3ZmN8" >> .env
        working-directory: ./frontend

      - name: Build the React App
        run: npm run build
        working-directory: ./frontend

      - name: Deploy to Hostinger
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "frontend/dist/"
          TARGET: "/var/www/outreach"
